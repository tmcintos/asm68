name: Build and Release asm68

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]    # This triggers when you click "Publish" in the Web UI
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout into a subdirectory named 'asm68'
      - name: Checkout asm68
        uses: actions/checkout@v4
        with:
          path: asm68

      - name: Install Build Essentials
        run: sudo apt-get update && sudo apt-get install -y make gcc

      # 2. Setup tools using 'make install'
      - name: Setup M6800 Cross Assembler
        run: |
          git clone https://github.com/tmcintos/motorola-6800-assembler.git
          cd motorola-6800-assembler
          make
          sudo make install

      - name: Setup Hex2bin
        run: |
          git clone https://github.com/tmcintos/Hex2bin-2.5.git
          cd Hex2bin-2.5
          make
          sudo make install

      - name: Setup bintomon
        run: |
          git clone https://github.com/jefftranter/6502.git
          cd 6502/util/bintomon
          gcc bintomon.c -o bintomon
          sudo install -m 755 bintomon /usr/local/bin/

      # 3. Build inside the subdirectory
      - name: Build asm68
        working-directory: ./asm68
        run: make

      # 4. Upload using the native artifact action
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: asm68-release
          path: |
            asm68/*-unified.s
            asm68/*.bin
            asm68/*.hex
            asm68/*.s19
            asm68/*.mot2bin

  release:
      needs: build
      if: github.event_name == 'release'
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Download Artifacts
          uses: actions/download-artifact@v4
          with:
            name: asm68-release
            path: release-assets

        - name: Create ZIP for Release
          run: |
            cd release-assets
            # Uses the tag name from the Web UI for the filename
            zip -r ../asm68-${{ github.event.release.tag_name }}.zip .

        - name: Upload to Existing Release
          uses: softprops/action-gh-release@v2
          with:
            # This 'files' line tells the action to attach the ZIP to the release that triggered it
            files: asm68-${{ github.event.release.tag_name }}.zip
            tag_name: ${{ github.event.release.tag_name }}
